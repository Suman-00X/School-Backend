name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # mongodb-memory-server downloads a mongod binary on first use
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
      # Fails when a schema change has no migration
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          npx drizzle-kit generate --config drizzle.platform.config.js --name ci-check
          git diff --exit-code --stat -- migrations migrations-platform || (echo "Run npm run db:generate (or db:generate:platform) and commit the migration" && exit 1)
          test -z "$(git status --porcelain migrations migrations-platform)"
      - name: Endpoint list is up to date
        run: |
          npm run docs:endpoints
          git diff --exit-code -- docs/ENDPOINTS.md || (echo "Run npm run docs:endpoints and commit docs/ENDPOINTS.md" && exit 1)
      - run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: school-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
